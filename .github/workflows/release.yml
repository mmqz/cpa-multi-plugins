name: Build & Release Plugins

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0-dev'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            ext: so
          # NOTE: darwin-amd64 (macos-13 Intel runner) removed — GitHub retired
          # Intel macOS hosted runners; the job queued forever and blocked the
          # release job (needs: build). Re-add only if an Intel runner appears.
          - os: darwin
            arch: arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            cc: clang
            ext: dylib
          - os: windows
            arch: amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cc: mingw-w64-x86_64-gcc
            ext: dll
    continue-on-error: ${{ matrix.optional || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Set up MSYS2 (Windows only)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false
          path-type: inherit

      - name: Build all plugins (Windows)
        if: matrix.os == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: gcc
        run: |
          which gcc 2>&1 || echo "which gcc failed"
          gcc --version 2>&1 | head -1 || echo "gcc invocation failed"
          mkdir -p dist/${{ matrix.os }}-${{ matrix.arch }}
          PLUGINS="workbuddy qoder trae"
          for plugin in $PLUGINS; do
            echo "=== Building $plugin ==="
            cd plugins/$plugin
            go mod download
            OUTPUT="../../dist/${{ matrix.os }}-${{ matrix.arch }}/${plugin}.${{ matrix.ext }}"
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o "$OUTPUT" .
            if [ $? -eq 0 ]; then
              echo "  ✅ $plugin built"
            else
              echo "  ❌ $plugin failed"
              exit 1
            fi
            cd ../..
          done
        shell: msys2 {0}

      - name: Build all plugins (non-Windows)
        if: matrix.os != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist/${{ matrix.os }}-${{ matrix.arch }}
          PLUGINS="workbuddy qoder trae"
          for plugin in $PLUGINS; do
            echo "=== Building $plugin ==="
            cd plugins/$plugin
            go mod download
            OUTPUT="../../dist/${{ matrix.os }}-${{ matrix.arch }}/${plugin}.${{ matrix.ext }}"
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o "$OUTPUT" .
            if [ $? -eq 0 ]; then
              echo "  ✅ $plugin built"
            else
              echo "  ❌ $plugin failed"
              exit 1
            fi
            cd ../..
          done
        shell: bash

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          Get-ChildItem dist/${{ matrix.os }}-${{ matrix.arch }} -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
          Compress-Archive -Path "dist/${{ matrix.os }}-${{ matrix.arch }}/*.dll" -DestinationPath "cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}.zip" -Force
          Write-Host "Created zip:"
          Get-Item "cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}.zip" | Select-Object Name, Length

      - name: Package artifacts (non-Windows)
        if: matrix.os != 'windows'
        run: |
          cd dist/${{ matrix.os }}-${{ matrix.arch }}
          rm -f *.h
          zip -r ../../cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}.zip .
          cd ../..
          ls -lh cpa-multi-plugins-*.zip
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}
          path: cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}.zip
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -lh release/

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: cpa-multi-plugins ${{ steps.version.outputs.version }}
          body: |
            # cpa-multi-plugins ${{ steps.version.outputs.version }}

            3 unified CPA plugins: **CodeBuddy/WorkBuddy**, **Qoder**, **Trae** — each merges the former CN/Intl/solo variants with automatic legacy auth-file adoption.

            ## Downloads
            - `cpa-multi-plugins-linux-amd64.zip` — Linux x86_64
            - `cpa-multi-plugins-linux-arm64.zip` — Linux ARM64
            - `cpa-multi-plugins-darwin-arm64.zip` — macOS Apple Silicon
            - `cpa-multi-plugins-windows-amd64.zip` — Windows x86_64

            > macOS Intel (darwin-amd64) is paused: GitHub retired Intel macOS runners.

            ## Installation (verified against real CLIProxyAPI host)
            1. Download and unzip the archive for your platform.
            2. Copy the `.so`/`.dylib`/`.dll` files to your CPA plugins directory (e.g. `plugins/linux/amd64/`).
            3. **Each plugin must be explicitly enabled** in `config.yaml` (per-plugin default is disabled):
               ```yaml
               plugins:
                 enabled: true
                 dir: "plugins"
                 configs:
                   workbuddy: { enabled: true }
                   qoder: { enabled: true }
                   trae: { enabled: true }
               ```
            4. Restart CPA and check logs for `pluginhost: plugin registered plugin_id=workbuddy/qoder/trae`.
            5. Login accounts via the management panel or Management API. Legacy `codebuddy-cn-/codebuddy-intl-/qoder-cn-/qoder-intl-/trae-cn-/trae-solo-cn-/trae-intl-` auth files are adopted automatically.

            ## Plugins
            | Plugin | Covers | Realms | Login options |
            |---|---|---|---|
            | workbuddy | CodeBuddy + WorkBuddy + codebuddy-cn + codebuddy-intl | CN (copilot.tencent.com) / Global (workbuddy.ai) / Intl (codebuddy.ai) | CLI + IDE, per-account region |
            | qoder | Qoder + qoder-cn + qoder-intl | CN (qoder.com.cn) / Intl (qoder.com) | Device flow + PAT, per-account region |
            | trae | Trae CN + Trae SOLO CN + Trae Intl | CN (api.trae.cn) / SOLO / Intl (marscode) | Per-variant device flow |

            See [README](https://github.com/mmqz/cpa-multi-plugins#readme) for details.
          files: release/*.zip
          draft: false
          prerelease: false
